<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@3.5.4/dist/locomotive-scroll.css">
    <link rel="stylesheet" href="style.css">
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
/>
    <title>Team-Site</title>
</head>
<body>
    <main>

        <header>
            <nav>
                <div class="logo">TeamSite</div>
                <ul>
                    <li>Home</li>
                    <li>About</li>
                    <li>Team</li>
                    <li>Projects</li>
                    <li>Services</li>
                </ul>
                <button>Get started</button>
            </nav>
        </header>

        <div class="container">
            <spline-viewer url="https://prod.spline.design/3u15jTWxYbjqQOVp/scene.splinecode" class="boat-3d"></spline-viewer> 
            <div class="items">
                <h1>Code That</h1>
                <h1>Inspires</h1>
            </div>  
        </div>
        
        <section class="page2">
            <div id="play">Explore</div>
            <div class="swiper">
  <!-- Additional required wrapper -->
  <div class="swiper-wrapper">
    <!-- Slides -->
    <div class="swiper-slide slide1" data-scroll data-scroll-speed="1"></div>
    <div class="swiper-slide slide2" data-scroll data-scroll-speed="1"></div>
    <div class="swiper-slide slide3" data-scroll data-scroll-speed="1"></div>
  </div>
  <!-- If we need pagination -->
  <div class="swiper-pagination"></div>

  <!-- If we need navigation buttons -->
  <div class="swiper-button-prev"></div>
  <div class="swiper-button-next"></div>

  <!-- If we need scrollbar -->
  <div class="swiper-scrollbar"></div>
</div>
</section>

<div class="page3"></div>
        </main>

 <script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.92/build/spline-viewer.js"></script>

</body>
</html>
