<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hover Effect Section</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
  }

  body {
    background: #f4f4f4;
  }

  .main {
    height: 80vh;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 0 5vw;
  }

  .card {
    position: relative;
    width: 25%;
    height: 100%;
    overflow: hidden;
    border-radius: 16px;
    transition: all 0.5s ease;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .card:hover img {
    transform: scale(1.05);
  }

  .overlay {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    width: 80%;
    height: 50px;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    opacity: 0;
    transform-origin: bottom;
    transition: all 0.4s ease;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  }

  .card:hover .overlay {
    opacity: 1;
    height: 90px;
  }

  .icon {
    font-size: 20px;
    font-weight: 700;
    color: #000;
  }

  .overlay-center {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .overlay button {
    border: none;
    background: transparent;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
    color: #333;
  }

  .overlay button:hover {
    color: #000;
    transform: scale(1.05);
  }

  @media (max-width: 900px) {
    .main {
      flex-direction: column;
      height: auto;
    }

    .card {
      width: 80%;
      height: 60vh;
    }
  }
</style>
</head>
<body>

<div class="main">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f" alt="">
    <div class="overlay">
      <span class="icon">•</span>
      <div class="overlay-center">
        <button>SHOP</button>
        <button>HOME</button>
      </div>
      <span class="icon">→</span>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1514996937319-344454492b37" alt="">
    <div class="overlay">
      <span class="icon">•</span>
      <div class="overlay-center">
        <button>SHOP</button>
        <button>PANTRY</button>
      </div>
      <span class="icon">→</span>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1616628182503-1b9b4e6a49c0" alt="">
    <div class="overlay">
      <span class="icon">•</span>
      <div class="overlay-center">
        <button>SHOP</button>
        <button>BATH</button>
      </div>
      <span class="icon">→</span>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1582719478141-1b6b1d17f49a" alt="">
    <div class="overlay">
      <span class="icon">•</span>
      <div class="overlay-center">
        <button>SHOP</button>
        <button>KITCHEN</button>
      </div>
      <span class="icon">→</span>
    </div>
  </div>
</div>

</body>
</html>
