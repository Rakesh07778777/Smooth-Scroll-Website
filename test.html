<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursor Follower</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fce4ec;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .cursor-follower {
            position: fixed;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff6b6b;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.2s ease, opacity 0.2s ease;
            transform: translate(-50%, -50%) scale(1);
            opacity: 0.8;
            mix-blend-mode: normal;
        }

        .cursor-follower.hover {
            transform: translate(-50%, -50%) scale(2);
            opacity: 0.6;
        }

        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .portfolio-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 80px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: clamp(60px, 10vw, 120px);
            font-weight: 900;
            color: #000;
            margin-bottom: 60px;
            line-height: 1.1;
        }

        .interactive-area {
            display: inline-block;
            padding: 20px 40px;
            background: white;
            border-radius: 12px;
            font-size: 18px;
            color: #333;
            margin: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .interactive-area:hover {
            transform: translateY(-5px);
        }

        .demo-section {
            margin-top: 100px;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card-title {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            margin-bottom: 10px;
        }

        .card-text {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="cursor-follower" id="cursorFollower"></div>

    <div class="content">
        <div class="portfolio-label">Portfolio ▼</div>
        
        <h1>The work</h1>

        <div class="interactive-area">Hover over me!</div>
        <div class="interactive-area">And me too!</div>

        <div class="demo-section">
            <div class="demo-grid">
                <div class="card">
                    <div class="card-title">Project 01</div>
                    <div class="card-text">Hover to see the cursor grow</div>
                </div>
                <div class="card">
                    <div class="card-title">Project 02</div>
                    <div class="card-text">Interactive elements</div>
                </div>
                <div class="card">
                    <div class="card-title">Project 03</div>
                    <div class="card-text">Smooth animations</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cursor = document.getElementById('cursorFollower');
        let mouseX = 0;
        let mouseY = 0;
        let cursorX = 0;
        let cursorY = 0;

        // Update mouse position
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Smooth cursor following animation
        function animateCursor() {
            const speed = 0.15;
            
            cursorX += (mouseX - cursorX) * speed;
            cursorY += (mouseY - cursorY) * speed;
            
            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';
            
            requestAnimationFrame(animateCursor);
        }

        animateCursor();

        // Get all interactive elements
        const interactiveElements = document.querySelectorAll('.interactive-area, .card, h1');

        // Add hover effect
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.classList.add('hover');
            });
            
            el.addEventListener('mouseleave', () => {
                cursor.classList.remove('hover');
            });
        });

        // Hide cursor when it leaves the window
        document.addEventListener('mouseleave', () => {
            cursor.style.opacity = '0';
        });

        document.addEventListener('mouseenter', () => {
            cursor.style.opacity = '1';
        });
    </script>
</body>
</html>
